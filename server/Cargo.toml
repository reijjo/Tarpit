[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls", "uuid"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
