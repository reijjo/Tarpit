info:
  name: duplicate selection ids
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/{{bets}}"
  body:
    type: json
    data: |-
      {
        "stake": 10,
        "finalOdds": 1.85,
        "finalType": "single",
        "legs": [
          {
            "category": "NBA",
            "homeTeam": "Lakers",
            "awayTeam": "Celtics",
            "eventDate": "2026-11-19",
            "odds": 1.85,
            "betType": "bet_builder",
            "selections": [
              { "id": "duplicate", "selection": "Lakers win" },
              { "id": "duplicate", "selection": "Over 2.5" }
            ]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
