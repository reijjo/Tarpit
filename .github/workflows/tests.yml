name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      HOST: 127.0.0.1
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      TEST_DATABASE_URL: postgres://tarpit:testpassword@127.0.0.1:5433/tarpit_test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tarpit
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: tarpit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tarpit -d tarpit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Run database migrations
        run: sqlx migrate run --database-url "$TEST_DATABASE_URL"

      - name: Run Rust tests
        run: cargo test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
